# creates a new npm release
name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: test action
        uses: ./
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        env:
          RPC_POLYGON: "https://rpc.polygon.com"

      - name: test action (assertion)
        run: |
          test "${{env.RPC_POLYGON}}" = "https://rpc.polygon.com"
          test "${{env.RPC_MAINNET}}" = "https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}"
          test "${{env.RPC_ARC}}" = "https://arc-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}"

  # action.yml runs dist/action.js, so a bundle that lags src/ or the lockfile ships silently
  dist-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # pin@v6.0.0

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - run: npm run build

      - name: assert dist is committed
        run: |
          if ! git diff --quiet -- dist; then
            git diff --stat -- dist
            echo "::error::dist/ does not match a fresh build. Run 'npm run build' and commit dist/."
            exit 1
          fi
